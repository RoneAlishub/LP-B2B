# Base44 sandbox/dev compose for this repository.
#
# This project is a single static HTML page (index.html) plus its images
# (hero.png, about.png, mall.png). There is no build step, no backend and no
# database, so a plain static file server serves the cloned source directly.
# The repo is bind-mounted, so edits to index.html / the images are picked up
# on the next request (just refresh the preview; no rebuild needed).
#
# Why python's http.server rather than nginx: the sandbox repo root is mode 700
# owned by root, so an nginx worker (which drops to the unprivileged nginx user)
# cannot traverse it and answers 403. http.server runs as root and reads the
# mounted source fine. It is threaded and re-reads files from disk per request.
#
# Run:  docker compose -f docker-compose.base44.yml up -d --build
# Web entry point: http://localhost:3000

services:
  web:
    image: python:3.12-slim
    working_dir: /site
    # Serve the cloned source, not a baked image, so edits stay visible.
    volumes:
      - ./:/site:ro
    command: ["python3", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      # Fetch the real page (slim image has no curl/wget, so use python).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/').read(1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
